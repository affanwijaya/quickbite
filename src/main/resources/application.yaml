server:
  # Platform hosting (Vercel/Railway/Render) memberi port lewat variabel PORT
  port: ${PORT:8080}

spring:
  application:
    name: ordering-system
  web:
    resources:
      cache:
        # File di dalam .jar selalu bertanggal 1980, sehingga browser mengira file tidak pernah berubah.
        # Matikan Last-Modified dan minta browser selalu mengecek ulang agar tampilan terbaru selalu dipakai.
        use-last-modified: false
        cachecontrol:
          no-cache: true
  datasource:
    # Urutan prioritas: DB_* (manual) -> PG* (otomatis dari Neon di Vercel) -> default PostgreSQL Docker lokal
    url: ${DB_URL:jdbc:postgresql://${PGHOST_UNPOOLED:localhost}:5432/${PGDATABASE:ordering_db}?sslmode=${DB_SSLMODE:prefer}}
    username: ${DB_USERNAME:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:secretpassword}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Skema dikelola Flyway (db/migration); Hibernate hanya mengecek kecocokan entity
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    # Database lama yang tabelnya sudah dibuat Hibernate dianggap sudah di versi 1
    baseline-on-migrate: true
    baseline-version: 1

payment:
  gateway:
    endpoint-url: "https://api.mockpayment.com/v1/charge"
    api-key: "sk_live_sample_secret_key_12345"